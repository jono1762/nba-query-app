[project]
name = "nba-query"
version = "0.1.0"
description = "Ask NBA player stat questions in plain English; answers come from SQL over real data."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nba_query"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W: style errors, F: real bugs (unused/undefined names), I: import order,
# B: common bug patterns, UP: modern Python syntax, SIM: simplifications
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
